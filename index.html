<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>REVENUE & EMPIRE: Real Estate RPG</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Real Estate RPG">
    <link rel="apple-touch-icon" href="image_generation_content/13773131596121703961">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

        :root {
            --bg-obsidian: #050507;
            --glass-panel: rgba(18, 18, 24, 0.8);
            --glass-card: rgba(28, 28, 38, 0.7);
            --border-subtle: rgba(212, 175, 55, 0.15);
            --border-active: rgba(212, 175, 55, 0.4);
            --gold: #d4af37;
            --gold-glow: rgba(212, 175, 55, 0.25);
            --text-main: #f3f0ea;
            --text-muted: #9490a0;
            --danger: #ef4444;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-obsidian);
            color: var(--text-main);
            min-height: 100vh;
            padding-top: env(safe-area-inset-top);
            padding-bottom: calc(100px + env(safe-area-inset-bottom));
            overflow-x: hidden;
            background-image: url('image_generation_content/8981768286863944199');
            background-size: cover;
            background-attachment: fixed;
        }

        header {
            padding: 16px 20px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(5, 5, 7, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-subtle);
        }

        .logo-title {
            font-family: 'Cinzel', serif;
            font-size: 16px;
            color: var(--gold);
            font-weight: 700;
            letter-spacing: 1px;
            text-shadow: 0 2px 8px rgba(212,175,55,0.3);
        }

        .subtitle {
            font-family: 'Cinzel', serif;
            font-size: 9px;
            letter-spacing: 2px;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-top: 2px;
        }

        .container {
            width: 100%;
            max-width: 440px;
            margin: 0 auto;
            padding: 16px;
        }

        /* POGODA HERO TILE */
        .weather-hero-card {
            position: relative;
            background: linear-gradient(135deg, rgba(20, 18, 26, 0.9), rgba(10, 8, 14, 0.95)), url('image_generation_content/47208ac9.jpeg');
            background-size: cover;
            background-position: center;
            border: 1px solid var(--border-active);
            border-radius: 20px;
            padding: 18px;
            margin-bottom: 16px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
        }

        .weather-hero-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .location-badge {
            background: rgba(212, 175, 55, 0.15);
            border: 1px solid var(--border-active);
            color: var(--gold);
            font-family: 'Cinzel', serif;
            font-size: 11px;
            font-weight: 700;
            padding: 5px 12px;
            border-radius: 20px;
            letter-spacing: 1px;
        }

        .weather-main-info {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .temp-display {
            font-family: 'Cinzel', serif;
            font-size: 34px;
            font-weight: 700;
            color: var(--text-main);
        }

        .condition-text {
            font-size: 12px;
            color: var(--gold);
            font-family: 'Cinzel', serif;
            margin-top: 2px;
        }

        .weather-graphic-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            border: 1px solid var(--border-subtle);
            object-fit: cover;
        }

        .weather-footer-details {
            display: flex;
            gap: 12px;
            margin-top: 12px;
            padding-top: 8px;
            border-top: 1px solid rgba(255,255,255,0.06);
            font-size: 10px;
            color: var(--text-muted);
        }

        /* OPIERDALACZ BANNER */
        #roast-banner {
            display: none;
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.2), rgba(139, 0, 0, 0.4));
            border: 1px solid var(--danger);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 16px;
            animation: pulseAlert 1.5s infinite;
        }

        @keyframes pulseAlert {
            0% { box-shadow: 0 0 10px rgba(239,68,68,0.2); }
            50% { box-shadow: 0 0 25px rgba(239,68,68,0.5); }
            100% { box-shadow: 0 0 10px rgba(239,68,68,0.2); }
        }

        .roast-title {
            font-family: 'Cinzel', serif;
            font-size: 12px;
            color: #fca5a5;
            font-weight: 700;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .roast-text {
            font-size: 11px;
            color: var(--text-main);
            line-height: 1.4;
        }

        /* Glass Cards & Grid */
        .glass-card {
            background: var(--glass-panel);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 16px;
        }

        .tile-card {
            background: var(--glass-card);
            border: 1px solid var(--border-subtle);
            border-radius: 14px;
            padding: 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tile-card:active {
            transform: scale(0.97);
            background: rgba(212, 175, 55, 0.1);
            border-color: var(--gold);
        }

        .tile-icon { font-size: 22px; margin-bottom: 6px; display: block; }
        .tile-title { font-family: 'Cinzel', serif; font-size: 11px; color: var(--gold); font-weight: 600; }

        /* Stats HUD */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            padding: 8px 4px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .stat-label { font-size: 8px; color: var(--text-muted); font-family: 'Cinzel', serif; text-transform: uppercase; }
        .stat-val { font-size: 13px; font-weight: 700; color: var(--gold); margin-top: 2px; }

        .progress-group { margin-top: 10px; }
        .progress-label { display: flex; justify-content: space-between; font-size: 10px; color: var(--text-muted); margin-bottom: 4px; font-family: 'Cinzel', serif; }
        .bar-track { background: rgba(255, 255, 255, 0.05); border-radius: 6px; height: 8px; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.05); }
        .bar-fill { height: 100%; border-radius: 6px; transition: width 0.5s ease; }
        .fill-hp { background: linear-gradient(90deg, #dc2626, #ef4444); }
        .fill-xp { background: linear-gradient(90deg, #d4af37, #fde047); }
        .fill-water { background: linear-gradient(90deg, #2563eb, #38bdf8); }

        .btn-sleek {
            background: linear-gradient(135deg, rgba(212,175,55,0.15), rgba(212,175,55,0.05));
            border: 1px solid var(--border-active);
            color: var(--gold);
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 12px;
            font-family: 'Cinzel', serif;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            width: 100%;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
        }

        .btn-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }

        .btn-action {
            background: var(--glass-card);
            border: 1px solid var(--border-subtle);
            color: var(--text-main);
            padding: 10px 6px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            text-align: center;
        }

        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .section-title { font-family: 'Cinzel', serif; font-size: 13px; color: var(--gold); }

        .quest-card {
            background: var(--glass-card);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .quest-card.completed { opacity: 0.4; border-color: rgba(16, 185, 129, 0.3); text-decoration: line-through; }
        .quest-title { font-size: 12px; font-weight: 500; color: var(--text-main); margin-bottom: 2px; }
        .quest-meta { font-size: 10px; color: var(--text-muted); }

        .bottom-dock {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 32px);
            max-width: 410px;
            background: rgba(18, 18, 24, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-subtle);
            border-radius: 20px;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            padding: 8px;
            z-index: 1000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        .dock-btn {
            background: none; border: none; color: var(--text-muted);
            font-size: 9px; font-family: 'Cinzel', serif;
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            cursor: pointer; padding: 6px 0; border-radius: 12px; transition: all 0.2s;
        }
        .dock-btn.active { color: var(--gold); background: rgba(212, 175, 55, 0.08); border: 1px solid rgba(212, 175, 55, 0.2); }
        .dock-icon { font-size: 16px; }

        .tab-view { display: none; }
        .tab-view.active { display: block; }

        .modal-backdrop {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(8px);
            display: none; justify-content: center; align-items: center; z-index: 2000; padding: 20px;
        }
        .modal-window {
            background: #14141c; border: 1px solid var(--border-active); border-radius: 20px; padding: 24px; width: 100%; max-width: 360px; text-align: center;
        }

            width: 100%; background:
